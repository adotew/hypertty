name: DMG

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  dmg:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: true

      - uses: mlugg/setup-zig@v2
        with:
          version: 0.15.2

      - run: brew install xcodegen

      - name: Build
        run: make release ZIG="$(which zig)"

      - name: Package
        run: |
          mkdir dmg
          cp -R build/Build/Products/Release/Hypertty.app dmg/
          ln -s /Applications dmg/Applications
          hdiutil create -volname Hypertty -srcfolder dmg -format UDZO \
            Hypertty-arm64.dmg

      - uses: actions/upload-artifact@v4
        with:
          name: Hypertty-arm64
          path: Hypertty-arm64.dmg

      - name: Release
        if: startsWith(github.ref, 'refs/tags/')
        run: >-
          gh release create "$GITHUB_REF_NAME" Hypertty-arm64.dmg
          --generate-notes
        env:
          GH_TOKEN: ${{ github.token }}
